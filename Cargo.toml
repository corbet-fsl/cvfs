[package]
name = "cvfs"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Cross-platform filesystem storage backend for CareerVector workspaces: conditional writes, receipts, retained snapshots"
license = "FSL-1.1-ALv2"
readme = "README.md"
repository = "https://git.corbet.ch/corbet-fsl/cvfs"
keywords = ["storage", "filesystem", "crdt", "cv"]
categories = ["filesystem", "data-structures"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
